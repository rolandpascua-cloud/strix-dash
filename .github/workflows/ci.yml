name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install --quiet fastapi uvicorn psutil pydantic pytest "ruff==0.16.1"

      - name: Lint
        run: ruff check backend tests

      - name: Format check
        run: ruff format --check backend tests

      # The whole suite runs against captured fixtures: no NPU, no ROCm, no
      # ASUS platform driver, no network. That is why the fixtures exist.
      - name: Tests
        run: python -m pytest -q

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh packaging/*.sh packaging/strix-dash-server

      # A malformed sudoers file can lock every user out of sudo, so it is
      # validated in CI as well as at install time.
      - name: Validate sudoers
        run: |
          sudo apt-get install -y -qq sudo
          sudo visudo -cf packaging/sudoers.d/strix-dash

      - name: Validate systemd unit
        run: |
          sudo apt-get install -y -qq systemd
          systemd-analyze verify packaging/strix-dash.service 2>&1 \
            | grep -v "not executable" \
            | tee /tmp/verify.txt
          test ! -s /tmp/verify.txt

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publishing is irreversible: no fixture may carry host-identifying data.
      - name: Fixtures are sanitised
        run: ./scripts/sanitize-fixtures.sh --check

      # frontend/dist is committed so a clone runs offline; it must not drift
      # from src. NOTE: this is a CONTENT comparison, not an mtime one -- git
      # does not preserve mtimes, so every file has the checkout time after a
      # clone and `find -newer` compares nothing meaningful.
      - name: dist matches src
        run: |
          for f in frontend/src/js/*.js; do
            diff -q "$f" "frontend/dist/js/$(basename "$f")" || {
              echo "::error::$f differs from dist — run ./scripts/sync-dist.sh"; exit 1; }
          done
          diff -q frontend/src/index.html frontend/dist/index.html

      # Rebuild the stylesheet and compare, ignoring the generated header (which
      # carries a build timestamp and would never match).
      - name: Stylesheet is reproducible
        run: |
          cp frontend/dist/css/strix-dash.css /tmp/committed.css
          ./scripts/build-css.sh
          strip_header() { grep -v '^/\* strix-dash stylesheet' "$1" | grep -v '^   tailwindcss' | grep -v '^   Do not edit'; }
          if ! diff -q <(strip_header /tmp/committed.css) <(strip_header frontend/dist/css/strix-dash.css) >/dev/null; then
            echo "::error::committed stylesheet differs from a fresh build — run ./scripts/build-css.sh"
            exit 1
          fi
